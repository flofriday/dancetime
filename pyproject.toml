[project]
name = "dancetime"
version = "0.1.0"
description = "A website to find dance events in Vienna."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "dateparser>=1.4.3",
    "icalendar>=7.3.0",
    "jinja2>=3.1.6",
    "regex>=2026.9.29",
    "requests>=2.34.2",
]

[dependency-groups]
dev = ["ruff>=0.17.3"]
